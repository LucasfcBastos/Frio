# One command demo: docker compose up --build
#   Dashboard: http://localhost:5173   API docs: http://localhost:8000/api/docs/
services:
  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_ALLOWED_HOSTS: "*"
      SQLITE_PATH: data/db.sqlite3
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/stores/')"]
      interval: 5s
      timeout: 3s
      retries: 30

  simulator:
    build: ./backend
    command: python manage.py simulate
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SQLITE_PATH: data/db.sqlite3
    volumes:
      - db-data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
